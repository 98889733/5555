name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files (three.js offline)
        run: |
          # распаковать zip, если залит архивом
          for z in $(find . -maxdepth 2 -name "*.zip" -not -path "./node_modules/*"); do unzip -o "$z" -d unzipped; done
          IDX=$(find . -name index.html -not -path "./node_modules/*" -not -path "./www/*" | head -n 1)
          echo "Found index: $IDX"
          [ -z "$IDX" ] && { echo "index.html не найден в репозитории"; ls -R; exit 1; }
          SRC=$(dirname "$IDX")
          mkdir www
          cp "$SRC/index.html" www/
          [ -f "$SRC/manifest.json" ] && cp "$SRC/manifest.json" www/ || true
          npm init -y
          npm i three@0.128.0
          cp node_modules/three/build/three.min.js www/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html

      - name: Create Android project
        run: |
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Island Builder" com.island.builder --web-dir=www
          npx cap add android
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: island-builder-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
